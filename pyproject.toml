[project]
name = "deauville"
version = "0.1.0"
description = "The programme of the Deauville Festival du Rire: classes, API and command line"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
deauville = "deauville.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deauville"]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
# The code writes Optional[X] and not "X | None".
ignore = ["UP007", "UP045"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests", "B3/side", "B5/side"]
